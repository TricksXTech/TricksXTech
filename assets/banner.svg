<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="TricksXTech banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .sub { font: 500 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6f6ff; letter-spacing: 1px; }
      .fade { animation: fade 1.2s ease-out both; }
      .fade2 { animation: fade 1.2s ease-out 0.4s both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <rect width="1200" height="220" fill="url(#bg)"/>
  <path d="M0 170 C 200 130, 400 210, 600 170 S 1000 130, 1200 170 L1200 220 L0 220 Z" fill="#ffffff" fill-opacity="0.12"/>
  <path d="M0 190 C 250 160, 450 220, 700 190 S 1050 165, 1200 190 L1200 220 L0 220 Z" fill="#ffffff" fill-opacity="0.12"/>
  <text x="600" y="100" text-anchor="middle" class="title fade">TricksXTech</text>
  <text x="600" y="140" text-anchor="middle" class="sub fade2">FRONTEND &amp; BLOCKCHAIN DEVELOPER</text>
</svg>
